<app-note-toolbar
  [searchControl]="searchControl"
  (createClicked)="openCreateDialog()"
  (sortChanged)="onSortChanged($event)"
></app-note-toolbar>

@if (loading) {
  <div class="loading-container">
    <i class="pi pi-spin pi-spinner"></i>
    <p>Loading notes...</p>
  </div>
} @else if (myNotes.length === 0 && sharedNotes.length === 0) {
  <app-empty-state></app-empty-state>
} @else {
  @if (myNotes.length > 0) {
    <section class="notes-section">
      <h2>My Notes</h2>

      <app-note-grid
        [notes]="myNotes"
        (edit)="editNote($event)"
        (delete)="deleteNote($event)"
        (archive)="archiveNote($event)"
        (share)="openShareDialog($event)"
      ></app-note-grid>
    </section>

    @if (!loading && myNotes.length > 0) {
      <p-paginator
        [first]="searchFilter.page * searchFilter.size"
        [rows]="searchFilter.size"
        [totalRecords]="totalElements"
        [rowsPerPageOptions]="[5, 10, 20]"
        (onPageChange)="onPageChange($event)"
      ></p-paginator>
    }
  }

  @if (sharedNotes.length > 0) {
    <section class="notes-section shared-section">
      <h2>Shared with me</h2>

      <app-note-grid [notes]="sharedNotes"></app-note-grid>
    </section>
  }
}

<app-note-dialog
  [(visible)]="dialogVisible"
  [note]="selectedNote"
  (save)="saveNote($event)"
></app-note-dialog>

<app-share-note
  [(visible)]="shareDialogVisible"
  [noteId]="shareNoteId"
  (share)="shareNote($event)"
></app-share-note>
